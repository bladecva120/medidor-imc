<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        
        <h1 class="titulo">Medidor IMC</h1>

        <div class="medidor">

            <div class="ponteiro">
                <div class="agulha"></div>
                <div class="pino"></div>
            </div>


            <div class="dados">

                <div class="altura">
                    <input id="altura" type="text" inputmode="numeric" placeholder="Altura...Ex:1.70m">
                </div>

                <div class="peso">
                    <input id="peso" type="text" inputmode="numeric" placeholder="Peso... Ex: 80kg">
                </div>            
            </div>

            <div class="valor">00,00</div>

            <div class="escala">
                <span id="n1">15</span>
                <span id="n2">20</span>
                <span id="n3">25</span>
                <span id="n4">30</span>
                <span id="n5">35</span>
                <span id="n6">40</span>
                <span id="n7"></span>
            </div>

        </div>

        <div class="botoes">

            <div class="btn_calcular">Calcular</div>
            <div class="btn_limpar">Limpar</div>

        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
